services:
  # Microservice 1: User Identity & Authentication Service
  - type: web
    name: user-service
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm run start:user
    envVars:
      - key: MONGODB_URI
        sync: false

  # Microservice 2: Skill Catalog & Management Service
  - type: web
    name: skill-service
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm run start:skill
    envVars:
      - key: MONGODB_URI
        sync: false

  # Microservice 3: Exchange, Workspace & Collaboration Service
  - type: web
    name: exchange-service
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm run start:exchange
    envVars:
      - key: MONGODB_URI
        sync: false

  # Microservice 4: Real-time Socket.IO & E2EE Messaging Service
  - type: web
    name: messaging-service
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm run start:messaging

  # Frontend Web Client (Single Page Application)
  - type: web
    name: skill-exchange-frontend
    runtime: static
    autoDeploy: true
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_USER_API_URL
        sync: false
      - key: VITE_SKILL_API_URL
        sync: false
      - key: VITE_EXCHANGE_API_URL
        sync: false
      - key: VITE_MESSAGING_API_URL
        sync: false
